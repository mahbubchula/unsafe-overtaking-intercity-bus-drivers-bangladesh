<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Unsafe overtaking research in Bangladesh</title>
  <desc id="description">Colorful research banner combining an intercity bus, a curved roadway, and connected analytical nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062C2B"/>
      <stop offset="0.48" stop-color="#075B4B"/>
      <stop offset="1" stop-color="#151A4F"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232946"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D0BA"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1065" cy="62" r="112" fill="#F42A41" opacity=".14"/>
  <circle cx="1100" cy="52" r="42" fill="#F42A41" opacity=".92" filter="url(#glow)"/>
  <circle cx="1100" cy="52" r="29" fill="#F42A41"/>

  <path d="M-40 315C180 198 364 366 600 283S935 214 1260 323V410H-40Z" fill="url(#road)"/>
  <path d="M-20 308C200 205 370 355 602 274S947 217 1230 305" fill="none" stroke="#E5E7EB" stroke-width="5" stroke-dasharray="30 24" opacity=".85"/>
  <path d="M-20 274C192 174 365 315 590 239S930 177 1225 268" fill="none" stroke="#FFC857" stroke-width="4" opacity=".88"/>

  <g filter="url(#shadow)" transform="translate(840 198) rotate(-7)">
    <rect x="0" y="0" width="205" height="82" rx="17" fill="url(#bus)"/>
    <path d="M18 15H178L195 52H18Z" fill="#E0F2FE" opacity=".95"/>
    <path d="M34 15V52M76 15V52M118 15V52M160 15V52" stroke="#075985" stroke-width="4" opacity=".72"/>
    <rect x="18" y="61" width="169" height="7" rx="3.5" fill="#F8FAFC" opacity=".88"/>
    <circle cx="45" cy="82" r="17" fill="#0F172A"/><circle cx="45" cy="82" r="7" fill="#CBD5E1"/>
    <circle cx="166" cy="82" r="17" fill="#0F172A"/><circle cx="166" cy="82" r="7" fill="#CBD5E1"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="3" opacity=".78">
    <path d="M680 88L750 53 821 100 753 139 680 88Z"/>
    <path d="M680 88L684 164 753 139 814 181"/>
    <path d="M753 139L821 100 884 130"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="680" cy="88" r="8" fill="#35D0BA"/>
    <circle cx="750" cy="53" r="8" fill="#38BDF8"/>
    <circle cx="821" cy="100" r="9" fill="#A78BFA"/>
    <circle cx="753" cy="139" r="10" fill="#F472B6"/>
    <circle cx="684" cy="164" r="7" fill="#35D0BA"/>
    <circle cx="814" cy="181" r="8" fill="#FFC857"/>
    <circle cx="884" cy="130" r="7" fill="#38BDF8"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#F8FAFC">
    <text x="62" y="80" font-size="18" font-weight="700" letter-spacing="3" fill="#7EE7D6">ROAD SAFETY • BANGLADESH</text>
    <text x="62" y="140" font-size="46" font-weight="800">Unsafe Overtaking</text>
    <text x="62" y="191" font-size="31" font-weight="650" fill="#DBEAFE">among Intercity Bus Drivers</text>
    <rect x="62" y="219" width="513" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="62" y="257" font-size="18" font-weight="550" fill="#D1FAE5">Integrated Bayesian • Machine Learning • Explainable AI</text>
    <text x="62" y="289" font-size="16" fill="#A7F3D0">Master of Engineering Thesis Research</text>
  </g>
</svg>
