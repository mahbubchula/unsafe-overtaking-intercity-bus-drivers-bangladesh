name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install --requirement environment/requirements-dev.txt

      - name: Compile validation scripts
        run: python -m compileall -q scripts

      - name: Validate repository structure
        run: python scripts/verify_repository.py --allow-missing-documents

      - name: Validate available questionnaire files
        run: python scripts/verify_questionnaire.py --allow-missing-files
